<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087384">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strong12">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Strong12</title>
<style>
:root{
  --bg:#EEF1F2; --surface:#FFFFFF; --ink:#12202A; --muted:#566772; --line:#D3DADE;
  --teal:#087384; --teal-ink:#FFFFFF; --teal-soft:#DDEFF2; --zone:#2F86C9; --warn:#B4400C; --warn-soft:#FBE9DD; --ok:#1F7A4D;
  --display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1A21; --surface:#172530; --ink:#E8EEF1; --muted:#93A4AF; --line:#2A3C47; --teal:#4CC3D3; --teal-ink:#06262C; --teal-soft:#16363F; --zone:#6DB4EB; --warn:#F0985F; --warn-soft:#3A2416; --ok:#5CCB92}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto}
main{padding:calc(14px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.2px}
h1{font-size:30px;line-height:1.1}
h2{font-size:22px;margin:22px 0 8px}
h3{font-size:18px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);min-height:58px}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--teal);font-weight:600}

/* plate strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:12px 0 6px}
.plate{border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:68px;border-radius:12px}
.plate svg{width:42px;height:42px}
.plate .ring-bg{stroke:var(--line);fill:none;stroke-width:4}
.plate .ring{stroke:var(--teal);fill:none;stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.plate .dn{font-family:var(--display);font-weight:700;font-size:17px;fill:var(--ink)}
.plate .dw{font-size:12px;color:var(--muted)}
.plate[aria-pressed="true"]{background:var(--teal-soft)}
.plate[aria-pressed="true"] .dw{color:var(--ink);font-weight:600}
.plate.is-today .dw::after{content:" •";color:var(--teal)}

/* cards & rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.card.flat{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;background:var(--teal-soft);color:var(--teal);font-weight:600}
.pill.zone{background:#E1EEF9;color:#1D5F95}
@media (prefers-color-scheme:dark){.pill.zone{background:#16303F;color:var(--zone)}}
.btn{border:0;border-radius:10px;background:var(--teal);color:var(--teal-ink);padding:12px 16px;font-weight:600;min-height:46px}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn.quiet{background:var(--teal-soft);color:var(--teal)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:8px 12px;font-size:15px}
.btn[disabled]{opacity:.5}
.banner{display:flex;gap:10px;align-items:center;background:var(--teal-soft);border-radius:12px;padding:12px 14px;margin:10px 0;border:0;width:100%;text-align:left;color:var(--ink)}
.banner.warn{background:var(--warn-soft)}
.guard{font-size:13.5px;color:var(--muted);border-left:3px solid var(--warn);padding:2px 0 2px 10px;margin:12px 0}

/* exercise & sets */
.ex{padding:14px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .nm{font-weight:650;font-size:17px}
.sets{display:grid;gap:8px;margin-top:10px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:8px;align-items:center}
.set.nw{grid-template-columns:22px 1fr 46px}
.set .sn{color:var(--muted);text-align:center;font-size:14px}
.fld{position:relative}
.fld input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:0 34px 0 10px;font-size:19px;text-align:center;font-family:var(--display);font-weight:700}
.fld span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.chk{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.chk svg{width:22px;height:22px;stroke:var(--teal-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.chk[aria-pressed="true"] svg{opacity:1}
.hint{font-size:13.5px;color:var(--ok);font-weight:600;margin-top:8px}
.blk{border-top:1px solid var(--line)}
.blk:first-of-type{border-top:1px solid var(--line)}
.blk .bh{padding:10px 14px;background:var(--teal-soft)}
.blk.now{box-shadow:inset 5px 0 0 var(--teal)}
.blk .tip{padding:10px 14px 0;margin:0}
.addset{margin-top:8px;border:0;background:none;color:var(--teal);font-weight:600;padding:8px 0;min-height:40px}

/* check list */
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-height:52px}
.li:first-child{border-top:0}
.li .t{flex:1}
.li input[type=number],.li input[type=text]{width:84px;height:42px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);text-align:center;font-size:17px;font-family:var(--display);font-weight:700}
.box{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.box svg{width:18px;height:18px;stroke:var(--teal-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.box[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.box[aria-pressed="true"] svg{opacity:1}

/* fuel */
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .25s}
.bar.k i{background:var(--zone)}
.fuel-n{font-size:30px;line-height:1}
.entry{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.entry button{border:0;background:none;color:var(--muted);padding:0 6px;min-height:32px}

/* meals */
.res{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface);padding:11px 14px;min-height:52px}
.res:first-child{border-top:0}
.res b{display:block;font-weight:650}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:10px;padding:3px;gap:3px;margin:10px 0}
.seg button{border:0;background:none;border-radius:8px;padding:9px 2px;font-weight:600;font-size:14px;color:var(--muted);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.meal{padding:12px 14px;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal .nm{font-weight:650}
.meal .mx{font-size:14px;color:var(--muted)}

/* forms */
label.f{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea,.inp{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;font-size:17px}
textarea.inp{min-height:90px}
details.card{padding:0}
details.card summary{list-style:none;padding:14px;font-weight:650;display:flex;justify-content:space-between;align-items:center;min-height:52px;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:22px;color:var(--teal)}
details.card[open] summary::after{content:"–"}
details.card .body{padding:0 14px 14px}
details.card .body ul{margin:6px 0;padding-left:20px}
details.card .body li{margin:4px 0}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{text-align:left;padding:7px 6px;border-top:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:600;border-top:0}

/* rest timer, toast */
#rest{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;display:none;align-items:center;justify-content:space-between;z-index:30}
#rest.on{display:flex}
#rest b{font-family:var(--display);font-size:26px}
#rest button{border:0;border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 14px;font-weight:600;min-height:40px}
.set.tm{grid-template-columns:22px 1fr 1fr 46px 46px}
.set.tm.nw{grid-template-columns:22px 1fr 46px 46px}
.play{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:16px}
#rest .tl{display:flex;flex-direction:column;min-width:0}#rest .tl small{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest .tb{display:flex;gap:8px}
body.tm #toast{bottom:calc(142px + env(safe-area-inset-bottom))}
.tgt{margin-top:4px;font-size:14px;color:var(--teal);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90%}
#toast.on{opacity:1}
svg.spark{width:100%;height:56px;display:block}
.spark polyline{fill:none;stroke:var(--teal);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--teal)}
/* scanner and sheet */
#scan{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
#scan.on{display:flex}
#scanvid{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
#scan .guide{position:absolute;left:8%;right:8%;top:24%;height:26%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
#scan .panel{background:var(--surface);color:var(--ink);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .in{background:var(--surface);color:var(--ink);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <div id="rest" role="timer" aria-live="off"><div class="tl"><small id="restl">Rest</small><b id="restn">0:00</b></div><div class="tb"><button data-a="tadd">+15 s</button><button data-a="restskip">Skip</button></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="scan" role="dialog" aria-label="Scan a barcode">
    <video id="scanvid" playsinline muted></video><div class="guide"></div><canvas id="scancv" hidden></canvas>
    <div class="panel">
      <p id="scanmsg" class="small" style="margin:0 0 10px">Starting the camera…</p>
      <form id="codeform" class="row" autocomplete="off"><input id="codein" class="inp" inputmode="numeric" pattern="[0-9]*" placeholder="Or type the number under the barcode" aria-label="Barcode number"><button class="btn" type="submit">Look up</button></form>
      <button class="btn ghost block" data-a="scanclose" style="margin-top:10px">Close</button>
    </div>
  </div>
  <div id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetin"></div></div>
  <nav id="tabs" aria-label="Main"><div class="in">
    <button data-a="tab" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
    <button data-a="tab" data-v="week"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Week</button>
    <button data-a="tab" data-v="meals"><svg viewBox="0 0 24 24"><path d="M6 3v8a2 2 0 0 0 2 2v8M10 3v8M6 7h4M17 3c-2 2-2.5 5-2 8h2v10"/></svg>Meals</button>
    <button data-a="tab" data-v="log"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Log</button>
    <button data-a="tab" data-v="plan"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/></svg>Plan</button>
  </div></nav>
</div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const KEY = 'strong12.v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const dk = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pk = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const add = (k, n) => { const d = pk(k); d.setDate(d.getDate() + n); return dk(d); };
const today = () => dk(new Date());
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmt = (k) => { const d = pk(k); return DOWL[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate(); };
const fmtShort = (k) => { const d = pk(k); return MON[d.getMonth()] + ' ' + d.getDate(); };
const weekStart = (k) => add(k, -((pk(k).getDay() + 6) % 7));
const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- state ---------- */
const DEF = () => ({
  v: 1,
  settings: { start: today(), protein: 160, kcal: 2300, water: 100, sodium: 1500, sat: 15, fiber: 30, trans: 1, chol: 300, sugar: 36, pot: 3400, carb: 250, fat: 75, dbs: '30, 45', rotate: true, blockSeen: -1,
    supps: ['Creatine with morning coffee', 'Vitamin D3 + K2 with first meal', 'Magnesium glycinate at bedtime'], lastBackup: '',
    ldl: ['Oats or barley: ¾ cup dry, about 3 g beta-glucan (split across meals)', 'Beans or lentils: 1 cup cooked', 'Nuts: 1 oz, a small handful of walnuts or almonds', 'Olive oil in place of butter', 'Psyllium husk, if you use it: 10 g, 2 hours from other supplements', 'Plant sterols, if you use them: about 2 g'] },
  days: {}, scans: [], measures: [], labs: [], recovery: {}, grocery: {}, qs: {}, foods: {}, use: {}, useAt: {}, prog: {}, evald: {}
});
let S;
function load() {
  try {
    const r = localStorage.getItem(KEY);
    if (r) { const o = JSON.parse(r); const d = DEF(); return { ...d, ...o, settings: { ...d.settings, ...(o.settings || {}) } }; }
  } catch (e) { /* fall through */ }
  return DEF();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save. Storage may be full or blocked.'); } }
S = load(); save();
const D = (k) => S.days[k] || {};
const W = (k) => S.days[k] || (S.days[k] = {});
const ui = { tab: 'today', date: today(), meals: 'menu', log: 'scan', hist: false };

/* ---------- plan data ---------- */
const SCHED = {
  0: { type: 'rest', title: 'Rest day', sub: 'An easy 30 minute walk is optional.' },
  1: { type: 'strength', w: 'A', title: 'Strength A', sub: 'Legs and push', min: '50' },
  2: { type: 'z2', title: 'Zone 2 walk', sub: '45–60 minutes at a pace where you can talk in full sentences', min: '45–60' },
  3: { type: 'strength', w: 'B', title: 'Strength B', sub: 'Pull and posterior chain', min: '50' },
  4: { type: 'z2', title: 'Zone 2: row and walk', sub: '30 minutes rowing, 15 minutes walking, then 10 minutes of mobility', min: '55' },
  5: { type: 'strength', w: 'C', title: 'Strength C', sub: 'Full body, lighter', min: '50' },
  6: { type: 'z2', title: 'Long Zone 2 walk', sub: '60–75 minutes, a good one to do with family', min: '60–75' }
};
const WK = {
  A: [
    { id: 'a1', n: 'Leg press or goblet squat', sets: 3, reps: '8–12', note: 'ParaBody leg press, or goblet squat holding a 45' },
    { id: 'a2', n: 'Box step-ups', sets: 3, reps: '8–10 / side', note: 'Hold 30s' },
    { id: 'a3', n: 'Chest press', sets: 3, reps: '8–12', note: 'ParaBody chest press or dumbbell press' },
    { id: 'a4', n: 'Overhead press', sets: 2, reps: '8–10', note: 'Dumbbells; use 30s if 45s are too heavy' },
    { id: 'a5', n: 'Triceps pushdown', sets: 2, reps: '12–15', note: 'Band or cable' },
    { id: 'a6', n: 'Dead bug', sets: 2, reps: '8 / side', bw: true, note: 'Slow and controlled' }
  ],
  B: [
    { id: 'b1', n: 'Romanian deadlift', sets: 3, reps: '8–12', note: 'Dumbbells. Only if your back and hips feel fine' },
    { id: 'b2', n: 'Lat pulldown', sets: 3, reps: '8–12', note: 'ParaBody' },
    { id: 'b3', n: 'Seated or one-arm row', sets: 3, reps: '10 / side', note: 'ParaBody seated row, or one-arm dumbbell row' },
    { id: 'b4', n: 'Hip bridge or hip thrust', sets: 3, reps: '10–12', note: 'Add a dumbbell on your hips when easy' },
    { id: 'b5', n: 'Band pull-apart or face pull', sets: 2, reps: '15', bw: true, note: 'Band' },
    { id: 'b6', n: 'Dumbbell curl', sets: 2, reps: '10–12', note: '' },
    { id: 'b7', n: 'Farmer carry', sets: 3, reps: '30–40 s', timed: true, note: 'Dumbbells, steady breathing' }
  ],
  C: [
    { id: 'c1', n: 'Wall sit', sets: 3, reps: '30–45 s', timed: true, bw: true, note: 'Back flat on the wall' },
    { id: 'c2', n: 'Terminal knee extension', sets: 2, reps: '15', bw: true, note: 'Band around the knee' },
    { id: 'c3', n: 'Push-up or floor press', sets: 3, reps: '8–12', note: 'Weight is for the floor press' },
    { id: 'c4', n: 'Band row', sets: 3, reps: '12–15', bw: true, note: 'Band' },
    { id: 'c5', n: 'Pallof press', sets: 2, reps: '10 / side', bw: true, note: 'Band' }
  ]
};
const EQ = { a1: ['mc', 10], a3: ['mc', 5], a4: ['db'], a5: ['mc', 5], b1: ['db'], b2: ['mc', 5], b3: ['mc', 5], b4: ['mc', 10], b6: ['db'], b7: ['db'], c3: ['mc', 5] };
Object.values(WK).forEach((l) => l.forEach((e, i) => { e.main = i < 3; const q = EQ[e.id]; if (q) { e.eq = q[0]; e.inc = q[1] || 5; } }));
const VAR = {
  a1: { id: 'a1b', n: 'Dumbbell split squat', sets: 3, reps: '8–10 / side', eq: 'db', note: 'Rear foot on the box. Hold the 30s or 45s' },
  a3: { id: 'a3b', n: 'Incline dumbbell press', sets: 3, reps: '8–12', eq: 'db', note: 'Bench or box set at an incline' },

function series(field) {
  const out = [];
  S.scans.forEach((s) => { if (s[field] !== '' && s[field] != null) out.push([s.date, num(s[field])]); });
  S.measures.forEach((s) => { if (s[field] !== '' && s[field] != null) out.push([s.date, num(s[field])]); });
  S.labs.forEach((s) => { if (s[field] !== '' && s[field] != null) out.push([s.date, num(s[field])]); });
  return out.sort((a, b) => (a[0] < b[0] ? -1 : 1));
}
function spark(pts) {
  if (pts.length < 2) return '<div class="small muted">Add two entries to see a trend.</div>';
  const vs = pts.map((p) => p[1]), mn = Math.min(...vs), mx = Math.max(...vs), r = mx - mn || 1;
  const xy = pts.map((p, i) => [4 + (i / (pts.length - 1)) * 292, 50 - ((p[1] - mn) / r) * 44]);
  return `<svg class="spark" viewBox="0 0 300 56" preserveAspectRatio="none" aria-hidden="true"><polyline points="${xy.map((p) => p.join(',')).join(' ')}"/><circle cx="${xy[xy.length - 1][0]}" cy="${xy[xy.length - 1][1]}" r="3.5"/></svg>`;
}

  el.innerHTML = (results.length ? `<div class="card flat" style="margin:0">${results.map((f, i) => `<button class="res" data-a="pickfood" data-i="${i}"><b>${esc((f.brand && !String(f.name).toLowerCase().includes(String(f.brand).toLowerCase()) ? f.brand + ' ' : '') + f.name)}</b><span class="small muted">${esc(f.serv || '')} · ${f.k ?? '?'} kcal · ${f.p ?? '?'} g protein${f.sod != null ? ' · ' + f.sod + ' mg sodium' : ''} · ${srcTag(f)}</span></button>`).join('')}</div>` : '') + (note ? `<p class="small muted" style="margin:8px 0 0">${esc(note)}</p>` : '');
}
async function doSearch(q) {
  q = (q || '').trim();

  const tok = ++searchTok;
  results = searchLocal(q); drawResults('Searching online…');
  const r = await searchOFF(q);
  if (tok !== searchTok) return;
  if (r.err) { drawResults(r.err === 'offline' ? 'Online search is not available right now' + (results.length ? ', so these are foods on your phone.' : '. Try "Enter it myself".') : 'Nothing found online.'); return; }
  const seen = new Set(results.map((f) => f.code));
  results = results.concat(r.foods.filter((f) => !seen.has(f.code)));
  drawResults(r.foods.length || results.length ? 'Online results are a community database. Check the numbers against the package.' : 'Nothing found. Try fewer words, or "Enter it myself".');
}

function foodSheet(f, note, qty) {

      ${FLAB.map(([key, lab, u]) => fld(lab + (u ? ' (' + u + ')' : ''), key, f[key])).join('')}${fld('Servings you ate', 'qty', qty || 1, 'min="0.25"')}

    </form>`);
}
async function gotCode(code) {
  if (S.foods[code]) { foodSheet({ ...S.foods[code], code, src: 'saved' }, 'Saved from an earlier scan. Numbers are per serving.'); return; }
  sheet(`<h2 style="margin:0 0 4px">Looking up ${esc(code)}…</h2><p class="small muted">Only the barcode number is sent, to the Open Food Facts database.</p>`);
  const r = await lookupOFF(code);
  if (r.food) {
    const miss = ['k', 'p', 'sod', 'sat'].some((x) => r.food[x] === null);
    foodSheet(r.food, 'From Open Food Facts, a community database. Numbers are per serving. Compare them with the package' + (miss ? ' and fill in anything blank.' : '.'));
  } else {
    foodSheet({ code, name: '', serv: '', src: 'manual' },
      r.err === 'offline' ? 'Could not reach the database, so enter it from the label. It will be saved for next time.' : 'This barcode is not in the database. Enter it from the label once and it is saved for next time.');

}
function logFood(food, key, qty) {
  const q = qty || 1, d = W(ui.date), r1 = (v) => Math.round(v * q * 10) / 10;

  ['carb', 'fat', 'sat', 'trans', 'chol', 'sod', 'pot', 'fib', 'sug'].forEach((f) => { if (food[f] !== null && food[f] !== undefined) e[f] = r1(food[f]); });
  (d.fuel = d.fuel || []).push(e);

}
function saveFood(f) {
  const o = Object.fromEntries(new FormData(f).entries());
  const val = (x) => (o[x] === '' || o[x] === undefined ? null : num(o[x]));
  const food = { code: o.code, name: (o.name || 'Food').trim(), brand: o.brand, serv: o.serv, src: o.src === 'off' || o.src === 'common' ? o.src : 'manual' };
  FOODF.forEach((x) => { food[x] = val(x); });
  const key = food.code || 'm' + Date.now();

}
function quickList() {
  const all = {}; QUICK.forEach((f, i) => { all[f.code] = { ...f, _d: 10 - i }; });
  Object.entries(S.foods).forEach(([k, f]) => { all[k] = { ...f, code: k, _d: all[k] ? all[k]._d : 0 }; });
  return Object.values(all).sort((a, b) => ((S.use[b.code] || 0) * 1000 + b._d + (S.useAt[b.code] || 0) / 1e14) - ((S.use[a.code] || 0) * 1000 + a._d + (S.useAt[a.code] || 0) / 1e14)).slice(0, 6);
}
